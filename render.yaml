services:
  - type: web
    name: talaba-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false   # jdbc:postgresql://HOST/DB?sslmode=require  (Neon'dan)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://talaba-frontend.pages.dev,http://localhost:4200
      - key: FILES_DIR
        value: /app/files
