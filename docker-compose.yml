services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: talaba1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/talaba1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123}
      JWT_SECRET: ${JWT_SECRET:-AFasfsafa#$%@$@ffgsgq353q53ESF3qr32R}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://talaba-frontend.pages.dev}
    volumes:
      - ./files:/app/files

volumes:
  pgdata:
